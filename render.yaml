services:
  - type: web
    name: vantaro-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: FRONTEND_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: PROCREDIT_API_BASE_URL
        sync: false
      - key: PROCREDIT_MERCHANT_ID
        sync: false
      - key: PROCREDIT_CERT_PEM
        sync: false
      - key: PROCREDIT_KEY_PEM
        sync: false
      - key: PROCREDIT_CA_PEM
        sync: false
      - key: PROCREDIT_CURRENCY
        value: EUR
      - key: PROCREDIT_LANGUAGE
        value: en
      - key: PROCREDIT_TEST_MODE
        sync: false
      - key: TCDIAL_API_BASE_URL
        sync: false
      - key: TCDIAL_API_KEY
        sync: false
      - key: TCDIAL_WEBHOOK_PUBLIC_KEY
        sync: false
      - key: TCDIAL_WEBHOOK_URL
        sync: false
      - key: TCDIAL_CALL_STATUS_GROUPS
        sync: false
